[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskscope"
version = "0.1.1"
description = "Lightweight, distro-agnostic task manager and system monitor for Linux"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.8"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: System :: Monitoring",
]
# No hard dependencies: the GUI uses whichever Qt binding is installed and
# falls back to a terminal interface without one.
[project.optional-dependencies]
gui = ["PyQt6"]

[project.scripts]
taskscope = "taskscope.__main__:main"

[tool.setuptools.packages.find]
include = ["taskscope*"]
